[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"

[workspace.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1.44"
url = "2.5.7"
uuid = { version = "1.19.0", features = ["v4"] }
serde = "1.0.228"
serde_json = "1.0.147"
