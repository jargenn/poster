host = "127.0.0.1"
port = 3000
facebook_uri = "https://graph.facebook.com"

[database]
url = "sqlite:poster.sqlite"

[media_settings.process]
max_width = 4096
max_height = 4096
max_size_bytes = 10485760
allowed_content_types = ["image/jpeg", "image/png", "image/webp"]
jpeg_quality = 85
target_width = 2000
target_height = 2000

[media_settings.storage]
type = "Local"
base_path = "storage"
base_url = "http://127.0.0.1:3000"

[caches.user_config]
name = "user_config"
ttl = 300

[caches.session_data]
name = "session_data"
ttl = 300

[tracing]
api_key = "local-test-key"
protocol = "HttpBinary"
endpoint = "http://127.0.0.1:4318"
service_name = "poster-local"
